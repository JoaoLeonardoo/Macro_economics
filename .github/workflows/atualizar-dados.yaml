name: Atualizar dados macroeconômicos

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Instalar pacotes R
        run: |
          Rscript -e "install.packages(c(
            'dplyr', 'jsonlite', 'readxl', 'lubridate', 'httr', 'httr2', 'tidyr', 
            'purrr', 'stringr', 'xml2', 'rvest', 'curl', 'magrittr', 'tibble', 
            'readr', 'forcats', 'glue', 'openssl', 'RCurl', 'plyr', 'reshape2', 
            'rlang', 'cli', 'crayon', 'withr', 'testthat'
          ), repos='https://cloud.r-project.org/')"

      - name: Listar arquivos e sessão R (debug)
        run: |
          echo "=== Arquivos no diretório ==="
          ls -la
          echo "=== Pacotes carregados ==="
          Rscript -e "sessionInfo()"

      - name: Executar script de geração do JSON
        run: Rscript gerar_json.R

      - name: Commit e push do novo JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ipca.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Atualização automática dos dados macroeconômicos"
          git push
