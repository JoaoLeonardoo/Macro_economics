<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dados Macroeconômicos</title>
    <!-- SheetJS para exportar Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <!-- ExcelJS para formatação -->
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <style>
        /* ===== Estilos base (como antes) ===== */
        body { font-family: Arial, sans-serif; background: #121212; color: #00ff00; padding: 20px; margin: 0; }
        h1 { color: #fff; }
        #atualizacao { color: #888; font-size: 0.9em; margin-bottom: 10px; }
        .filtros {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }
        .filtros .grupo {
            display: flex;
            flex-direction: column;
            min-width: 180px;
        }
        .filtros label {
            font-size: 0.8em;
            color: #aaa;
            margin-bottom: 3px;
        }
        .filtros .series-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 3px;
            max-width: 500px;
        }
        .filtros .series-checkboxes label {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #0f0;
            font-size: 0.9em;
        }
        .filtros input[type="date"] {
            background: #2a2a2a;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 8px;
            border-radius: 3px;
            font-family: inherit;
        }
        .filtros button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .filtros button:hover {
            background: #0c0;
        }
        .filtros button.secundario {
            background: #555;
            color: #fff;
        }
        .filtros button.secundario:hover {
            background: #666;
        }
        .exportar {
            background: #1e1e1e;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .exportar button {
            background: #007acc;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 3px;
            cursor: pointer;
        }
        .exportar button:hover {
            background: #005f9e;
        }

        /* ===== Estilo da tabela ===== */
        table {
            border-collapse: collapse;
            width: 100%;
            background: #1e1e1e;
            font-size: 0.9em;
            border: 1px solid #6B8E23;
        }
        th {
            background-color: #6B8E23;
            color: #fff;
            padding: 8px;
            border: 1px solid #6B8E23;
            position: sticky;
            top: 0;
        }
        td {
            background-color: #B0C47F;
            color: #000;
            padding: 6px;
            border: 1px solid #6B8E23;
        }
        tr:hover td {
            background-color: #C0D49F;
        }
        .container-tabela {
            max-height: 500px;
            overflow-y: auto;
            border: 2px solid #6B8E23;
            border-radius: 5px;
            position: relative;
        }

        /* ===== NOVA ANIMAÇÃO: RADAR ===== */
        .radar-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 100px;
            height: 100px;
            z-index: 100;
            pointer-events: none; /* não atrapalha cliques */
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .radar-container:hover {
            opacity: 1;
        }
        .radar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #00ff00;
            position: relative;
            background: rgba(0, 255, 0, 0.05);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
        }
        .radar::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60%;
            height: 2px;
            background: #00ff00;
            transform-origin: left center;
            transform: translate(0, -50%) rotate(0deg);
            animation: girar 3s linear infinite;
            box-shadow: 0 0 8px #00ff00;
        }
        .radar .ponto {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: pulsar 1.5s ease-in-out infinite;
            box-shadow: 0 0 15px #00ff00;
        }
        @keyframes girar {
            from { transform: translate(0, -50%) rotate(0deg); }
            to { transform: translate(0, -50%) rotate(360deg); }
        }
        @keyframes pulsar {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
        }

        /* Pequeno rótulo abaixo do radar */
        .radar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6em;
            color: #00ff00;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.5;
        }

        /* Responsivo: esconde o radar em telas muito pequenas */
        @media (max-width: 600px) {
            .radar-container {
                width: 60px;
                height: 60px;
                bottom: 10px;
                right: 10px;
            }
            .radar-label {
                display: none;
            }
        }
    </style>
</head>
<body>
    <h1>Séries Macroeconômicas Trimestrais</h1>
    <div id="atualizacao">Carregando data de atualização...</div>

    <!-- Filtros -->
    <div class="filtros">
        <div class="grupo">
            <label>Séries (marque as desejadas):</label>
            <div id="seriesCheckboxes" class="series-checkboxes"></div>
        </div>
        <div class="grupo">
            <label>Data inicial:</label>
            <input type="date" id="startDate">
        </div>
        <div class="grupo">
            <label>Data final:</label>
            <input type="date" id="endDate">
        </div>
        <div class="grupo" style="flex-direction: row; gap: 10px;">
            <button id="aplicarFiltro">Aplicar filtro</button>
            <button id="todasDatas" class="secundario">Todas as datas</button>
        </div>
    </div>

    <!-- Exportação -->
    <div class="exportar">
        <span>Exportar dados filtrados:</span>
        <button id="exportarExcel">📥 Excel (XLSX)</button>
    </div>

    <!-- Tabela -->
    <div class="container-tabela">
        <table id="tabelaDados">
            <thead id="tabelaHead"></thead>
            <tbody id="tabelaBody"></tbody>
        </table>
    </div>

    <!-- ===== RADAR ===== -->
    <div class="radar-container">
        <div class="radar">
            <div class="ponto"></div>
            <div class="radar-label">SCAN</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
