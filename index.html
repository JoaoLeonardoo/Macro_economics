<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dados Macroeconômicos</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Courier New', monospace; 
            background: #121212; 
            color: #00ff00; 
            padding: 20px; 
            margin: 0; 
            min-height: 100vh;
            position: relative;
        }
        h1 { color: #00ff00; text-shadow: 0 0 10px rgba(0,255,0,0.3); }
        #atualizacao { color: #555; font-size: 0.8em; margin-bottom: 15px; }

        /* Filtros */
        .filtros {
            background: rgba(18, 18, 18, 0.9);
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #00ff00;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
            position: relative;
            z-index: 2;
        }
        .filtros .grupo {
            display: flex;
            flex-direction: column;
            min-width: 180px;
        }
        .filtros label {
            font-size: 0.8em;
            color: #00ff00;
            margin-bottom: 3px;
        }
        .filtros .series-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 3px;
            border: 1px solid #00ff00;
            max-width: 500px;
        }
        .filtros .series-checkboxes label {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #00ff00;
            font-size: 0.85em;
            cursor: pointer;
        }
        .filtros .series-checkboxes input[type="checkbox"] {
            accent-color: #00ff00;
            width: 16px;
            height: 16px;
        }
        .filtros input[type="date"] {
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 8px;
            border-radius: 3px;
            font-family: inherit;
        }
        .filtros button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .filtros button:hover {
            background: #00cc00;
            box-shadow: 0 0 15px rgba(0,255,0,0.5);
        }
        .filtros button.secundario {
            background: #333;
            color: #00ff00;
            border: 1px solid #00ff00;
        }
        .filtros button.secundario:hover {
            background: #444;
        }

        .exportar {
            background: rgba(18, 18, 18, 0.9);
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #00ff00;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .exportar span {
            color: #00ff00;
        }
        .exportar button {
            background: #003366;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 8px 16px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }
        .exportar button:hover {
            background: #004488;
            box-shadow: 0 0 10px rgba(0,255,0,0.3);
        }

        /* Tabela estilo Matrix (sem cores de fundo) */
        .container-tabela {
            max-height: 500px;
            overflow-y: auto;
            border: 2px solid #00ff00;
            border-radius: 5px;
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.85);
        }
        table {
            border-collapse: collapse;
            width: 100%;
            background: transparent;
            font-size: 0.9em;
            color: #00ff00;
        }
        th {
            background: #000;
            color: #00ff00;
            padding: 8px;
            border: 1px solid #00ff00;
            position: sticky;
            top: 0;
            z-index: 3;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        td {
            background: transparent;
            color: #00ff00;
            padding: 6px;
            border: 1px solid #00ff00;
        }
        tr:hover td {
            background: rgba(0, 255, 0, 0.05);
        }
        .container-tabela::-webkit-scrollbar {
            width: 8px;
        }
        .container-tabela::-webkit-scrollbar-track {
            background: #000;
        }
        .container-tabela::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 4px;
        }

        /* MATRIX RAIN - agora com opacidade 0.4 */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
        }

        body > *:not(#matrix-canvas) {
            position: relative;
            z-index: 1;
        }

        /* RADAR - canto inferior direito, bem no canto */
        .radar-container {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 80px;
            height: 80px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .radar-container:hover {
            opacity: 1;
        }
        .radar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #00ff00;
            position: relative;
            background: rgba(0, 255, 0, 0.03);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.15);
        }
        .radar::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 55%;
            height: 2px;
            background: #00ff00;
            transform-origin: left center;
            transform: translate(0, -50%) rotate(0deg);
            animation: girar 3s linear infinite;
            box-shadow: 0 0 12px #00ff00;
        }
        .radar .ponto {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 7px;
            height: 7px;
            background: #00ff00;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: pulsar 1.5s ease-in-out infinite;
            box-shadow: 0 0 20px #00ff00;
        }
        @keyframes girar {
            from { transform: translate(0, -50%) rotate(0deg); }
            to { transform: translate(0, -50%) rotate(360deg); }
        }
        @keyframes pulsar {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.6); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
        }
        .radar-label {
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.5em;
            color: #00ff00;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.5;
            font-family: 'Courier New', monospace;
        }

        @media (max-width: 600px) {
            .radar-container {
                width: 60px;
                height: 60px;
                bottom: 8px;
                right: 8px;
            }
            .radar-label {
                display: none;
            }
            #matrix-canvas {
                opacity: 0.25;
            }
            .filtros .series-checkboxes {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <h1>📊 Séries Macroeconômicas Trimestrais</h1>
    <div id="atualizacao">Carregando data de atualização...</div>

    <div class="filtros">
        <div class="grupo">
            <label>Séries (marque as desejadas):</label>
            <div id="seriesCheckboxes" class="series-checkboxes"></div>
        </div>
        <div class="grupo">
            <label>Data inicial:</label>
            <input type="date" id="startDate">
        </div>
        <div class="grupo">
            <label>Data final:</label>
            <input type="date" id="endDate">
        </div>
        <div class="grupo" style="flex-direction: row; gap: 10px;">
            <button id="aplicarFiltro">Aplicar filtro</button>
            <button id="todasDatas" class="secundario">Todas as datas</button>
        </div>
    </div>

    <div class="exportar">
        <span>📥 Exportar dados filtrados:</span>
        <button id="exportarExcel">Excel (XLSX)</button>
    </div>

    <div class="container-tabela">
        <table id="tabelaDados">
            <thead id="tabelaHead"></thead>
            <tbody id="tabelaBody"></tbody>
        </table>
    </div>

    <!-- Radar fixo no canto inferior direito -->
    <div class="radar-container">
        <div class="radar">
            <div class="ponto"></div>
            <div class="radar-label">SCAN</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
